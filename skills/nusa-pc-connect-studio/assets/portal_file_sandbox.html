    return r'''<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Antrean File Percetakan • NUSA Kasir</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    :root {
      --bg: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);

    body {

      border-bottom: 1px solid var(--card-border);

    }
    .logo-area { display: flex; align-items: center; gap: 14px; }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    .logo-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .logo-sub { font-size: 12px; color: var(--text-sec); }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .btn {
      display: inline-flex;

    .btn-primary {
      background: #0284c7;

    .btn-primary:hover { background: #0369a1; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);

    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-success { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.3); color: #4ade80; }
    .btn-success:hover { background: rgba(34, 197, 94, 0.25); }
    .toggle-wrap { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-sec); font-weight: 600; cursor: pointer; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stat-val { font-size: 26px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    .stat-lbl { font-size: 12px; color: var(--text-sec); font-weight: 600; margin-top: 2px; }
    .stat-icon { font-size: 24px; opacity: 0.8; }
    
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .search-box {
      flex: 1;
      max-width: 360px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--text-muted); }
    
    .filter-tabs { display: flex; gap: 6px; }
    .filter-tab {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sec);
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      transition: all 0.15s;
    }
    .filter-tab.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.3);
      color: var(--primary);
    }
    
    .order-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .order-card:hover { border-color: rgba(56, 189, 248, 0.3); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
    .order-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 14px;
    }
    .order-meta { display: flex; align-items: center; gap: 12px; }
    .order-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 8px;
      color: #e2e8f0;
    }
    .cust-name { font-size: 16px; font-weight: 800; }
    .cust-phone {
      font-size: 12px;
      color: var(--text-sec);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .cust-phone:hover { color: var(--success); }
    .order-time { font-size: 12px; color: var(--text-muted); }
    .status-select {
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: #fff;
      outline: none;
      cursor: pointer;
    }
    .files-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .file-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .file-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .file-title-area { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .file-ext-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      background: rgba(56, 189, 248, 0.12);
      color: var(--primary);
    }
    .file-name-txt {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-size-txt { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .file-specs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .spec-pill {
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 6px;
      color: #cbd5e1;
    }
    .file-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
    .btn-file-dl {
      flex: 1;
      padding: 7px 12px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-file-dl:hover { background: rgba(56, 189, 248, 0.25); }
    .btn-file-preview {
      padding: 7px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-file-preview:hover { background: rgba(255, 255, 255, 0.12); }
    .order-notes {
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(245, 158, 11, 0.08);
      border-left: 3px solid var(--warning);
      border-radius: 8px;
      font-size: 12px;
      color: #fde68a;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-area">
      <div class="logo-icon">🖨️</div>
      <div>
        <div class="logo-title">Portal Antrean File Percetakan</div>
        <div class="logo-sub">Operator PC & Komputer Produksi • NUSA Kasir Local LAN</div>
      </div>
    </div>
    <div class="header-actions">
      <label class="toggle-wrap">
        <input type="checkbox" id="autoRefresh" checked>
        <span>Auto-Refresh (5s)</span>
      </label>
      <button class="btn btn-secondary" onclick="fetchOrders()">
        <span>↻ Segarkan</span>
      </button>
      <a href="/cetak" target="_blank" class="btn btn-primary">
        <span>+ Form Kirim File</span>
      </a>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div>
        <div class="stat-val" id="statTotal" style="color: #38bdf8;">0</div>
        <div class="stat-lbl">Total Berkas Masuk</div>
      </div>
      <div class="stat-icon">📁</div>
    </div>
    <div class="stat-card">
      <div>
        <div class="stat-val" id="statPending" style="color: #f59e0b;">0</div>
        <div class="stat-lbl">Menunggu Dicetak</div>
      </div>
      <div class="stat-icon">⏳</div>
    </div>
    <div class="stat-card">
      <div>
        <div class="stat-val" id="statProcessing" style="color: #60a5fa;">0</div>
        <div class="stat-lbl">Sedang Diproses</div>
      </div>
      <div class="stat-icon">⚙️</div>
    </div>
    <div class="stat-card">
      <div>
        <div class="stat-val" id="statCompleted" style="color: #4ade80;">0</div>
        <div class="stat-lbl">Selesai / Diambil</div>
      </div>
      <div class="stat-icon">✓</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Cari pemesan, nomor HP, atau nama file..." oninput="renderOrders()">
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all" onclick="setFilter('all', this)">Semua</button>
      <button class="filter-tab" data-filter="Menunggu" onclick="setFilter('Menunggu', this)">Menunggu</button>
      <button class="filter-tab" data-filter="Diproses" onclick="setFilter('Diproses', this)">Diproses</button>
      <button class="filter-tab" data-filter="Selesai" onclick="setFilter('Selesai', this)">Selesai</button>
    </div>
  </div>

  <div id="ordersContainer">
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <div>Memuat antrean file dari HP kasir...</div>
    </div>
  </div>

  <script>
    let allOrders = [];
    let currentFilter = 'all';
    let previousCount = 0;

    function playDing() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        osc.start();
        osc.stop(ctx.currentTime + 0.8);
      } catch (e) {
        console.warn('Audio play error:', e);
      }
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function timeAgo(dateStr) {
      const d = new Date(dateStr);
      const now = new Date();
      const sec = Math.floor((now - d) / 1000);
      if (sec < 60) return 'Baru saja';
      const min = Math.floor(sec / 60);
      if (min < 60) return min + ' mnt lalu';
      const hrs = Math.floor(min / 60);
      if (hrs < 24) return hrs + ' jam lalu';
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    }

    async function fetchOrders() {
      try {
        const res = await fetch('/api/print-order/files?t=' + Date.now());
        const data = await res.json();
        if (data.ok && Array.isArray(data.orders)) {
          if (previousCount > 0 && data.orders.length > previousCount) {
            playDing();
          }
          previousCount = data.orders.length;
          allOrders = data.orders;
          updateStats();
          renderOrders();
        }
      } catch (err) {
        console.warn('Fetch orders failed:', err);
      }
    }

    function updateStats() {
      let pending = 0, processing = 0, completed = 0;
      allOrders.forEach(o => {
        const st = (o.status || 'Menunggu').toLowerCase();
        if (st.includes('tunggu') || st.includes('baru')) pending++;
        else if (st.includes('proses')) processing++;
        else if (st.includes('selesai') || st.includes('ambil')) completed++;
      });
      document.getElementById('statTotal').innerText = allOrders.length;
      document.getElementById('statPending').innerText = pending;
      document.getElementById('statProcessing').innerText = processing;
      document.getElementById('statCompleted').innerText = completed;
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderOrders();
    }

    async function updateStatus(orderId, status) {
      try {
        const res = await fetch('/api/print-order/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: orderId, status: status })
        });
        const data = await res.json();
        if (data.ok) {
          fetchOrders();
        }
      } catch (e) {
        alert('Gagal mengubah status: ' + e.message);
      }
    }

    function renderOrders() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('ordersContainer');

      const filtered = allOrders.filter(o => {
        // Status filter
        if (currentFilter !== 'all') {
          const st = (o.status || 'Menunggu').toLowerCase();
          if (currentFilter === 'Menunggu' && !st.includes('tunggu') && !st.includes('baru')) return false;
          if (currentFilter === 'Diproses' && !st.includes('proses')) return false;
          if (currentFilter === 'Selesai' && !st.includes('selesai') && !st.includes('ambil')) return false;
        }
        // Search query
        if (q) {
          const name = (o.customerName || '').toLowerCase();
          const phone = (o.customerPhone || '').toLowerCase();
          const notes = (o.notes || '').toLowerCase();
          const filesMatch = (o.files || []).some(f => (f.name || '').toLowerCase().includes(q));
          if (!name.includes(q) && !phone.includes(q) && !notes.includes(q) && !filesMatch) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📄</div>
            <div style="font-weight: 700; font-size: 16px; color: #fff; margin-bottom: 4px;">Tidak Ada Berkas</div>
            <div>Belum ada pesanan cetak yang cocok dengan filter.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(o => {
        const orderIdStr = '#PRN-' + String(o.id).padStart(3, '0');
        const phone = o.customerPhone || '';
        let waLink = '';
        if (phone) {
          let cleanPhone = phone.replace(/[^0-9]/g, '');
          if (cleanPhone.startsWith('0')) cleanPhone = '62' + cleanPhone.substring(1);
          waLink = `<a href="https://wa.me/${cleanPhone}" target="_blank" class="cust-phone">📱 ${phone}</a>`;
        }

        const filesHtml = (o.files || []).map(f => {
          const ext = (f.name || '').split('.').pop().toUpperCase();
          const dlUrl = `/api/print-order/download?file=${encodeURIComponent(f.fileName)}&download=1&name=${encodeURIComponent(f.name)}`;
          const previewUrl = `/api/print-order/download?file=${encodeURIComponent(f.fileName)}&name=${encodeURIComponent(f.name)}`;
          
          const specPills = [];
          if (f.category) specPills.push(`<span class="spec-pill">${f.category}</span>`);
          if (f.paper) specPills.push(`<span class="spec-pill">${f.paper}</span>`);
          if (f.color) specPills.push(`<span class="spec-pill">${f.color}</span>`);
          if (f.copies && f.copies > 1) specPills.push(`<span class="spec-pill">${f.copies} Rangkap</span>`);
          if (f.material) specPills.push(`<span class="spec-pill">${f.material}</span>`);
          if (f.dimensions) specPills.push(`<span class="spec-pill">${f.dimensions}</span>`);
          if (f.finishing) specPills.push(`<span class="spec-pill">${f.finishing}</span>`);

          return `
            <div class="file-item">
              <div class="file-top">
                <div class="file-title-area">
                  <div class="file-ext-icon">${ext || 'FILE'}</div>
                  <div style="overflow: hidden;">
                    <div class="file-name-txt" title="${f.name}">${f.name}</div>
                    <div class="file-size-txt">${formatBytes(f.size)}</div>
                  </div>
                </div>
              </div>
              <div class="file-specs">
                ${specPills.join('')}
              </div>
              ${f.note ? `<div style="font-size: 11px; color: #94a3b8; font-style: italic;">"${f.note}"</div>` : ''}
              <div class="file-actions">
                <a href="${dlUrl}" class="btn-file-dl" download="${f.name}">
                  <span>📥 Unduh ke PC</span>
                </a>
                <a href="${previewUrl}" target="_blank" class="btn-file-preview">
                  <span>👁️ Preview</span>
                </a>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="order-card">
            <div class="order-header">
              <div class="order-meta">
                <span class="order-badge">${orderIdStr}</span>
                <span class="cust-name">${o.customerName || 'Pelanggan'}</span>
                ${waLink}
                <span class="order-time">• ${timeAgo(o.createdAt)}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 12px; color: var(--text-sec); font-weight: 600;">Status:</span>
                <select class="status-select" onchange="updateStatus(${o.id}, this.value)">
                  <option value="Menunggu" ${o.status === 'Menunggu' ? 'selected' : ''}>⏳ Menunggu</option>
                  <option value="Diproses" ${o.status === 'Diproses' ? 'selected' : ''}>⚙️ Diproses</option>
                  <option value="Selesai" ${o.status === 'Selesai' ? 'selected' : ''}>✓ Selesai</option>
                  <option value="Diambil" ${o.status === 'Diambil' ? 'selected' : ''}>📦 Diambil</option>
                </select>
              </div>
            </div>

            <div class="files-list">
              ${filesHtml || '<div style="color: var(--text-muted); font-size: 13px;">Tidak ada lampiran file fisik.</div>'}
            </div>

            ${o.notes ? `<div class="order-notes"><strong>Catatan:</strong> ${o.notes}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    // Auto refresh every 5s if toggle active
    setInterval(() => {
      if (document.getElementById('autoRefresh').checked) {
        fetchOrders();
      }
    }, 5000);

    fetchOrders();
  </script>
</body>
</html>
